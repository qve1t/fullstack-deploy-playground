name: Docker build

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  builds:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, client]
      fail-fast: false
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.app }}
        uses: docker/build-push-action@v7
        with:
          context: ./apps/${{ matrix.app }}
          target: prod
          build-args: GIT_SHA=${{ github.sha }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-${{ matrix.app }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}-${{ matrix.app }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

  db-migrate:
    needs: builds
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        run: npm i -g pnpm@11.13.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations to production
        run: pnpm db:deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  deploys:
    needs: [builds, db-migrate]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, client]
      fail-fast: false
    steps:
      - name: Redeploy ${{ matrix.app }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVICE: ${{ matrix.app }}
        run: |
          for attempt in 1 2 3; do
            if npx -y @railway/cli@5.52.1 redeploy --service "$SERVICE" --yes; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "::warning::redeploy of $SERVICE failed (attempt $attempt/3), retrying"
              sleep $((attempt * 15))
            fi
          done

          echo "::error::redeploy of $SERVICE failed after 3 attempts"
          exit 1
