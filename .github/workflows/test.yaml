name: Test workflow

on:
  pull_request:
    branches:
      - main

jobs:
  check-node-version:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Node version in .nvmrc matches every Dockerfile
        run: |
          expected="$(tr -d '[:space:]' < .nvmrc)"
          status=0

          for dockerfile in apps/api/Dockerfile apps/client/Dockerfile; do
            found="$(sed -n 's/^FROM node:\([^ -]*\).*/\1/p' "$dockerfile" | sort -u)"

            if [ "$found" != "$expected" ]; then
              echo "::error file=$dockerfile::.nvmrc says node $expected, this file says '$found'"
              status=1
            fi
          done

          [ $status -eq 0 ] && echo "Node $expected matches every Dockerfile."
          exit $status

  test-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        run: npm i -g pnpm@11.13.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate the Prisma client
        run: pnpm db:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  test-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/client
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        run: npm i -g pnpm@11.13.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
