x-db-url: &db-url postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: prod
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: *db-url
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:$$PORT/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  client:
    build:
      context: ./apps/client
      dockerfile: Dockerfile
      target: prod
    ports:
      - "8000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  migrate:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: migrate
    environment:
      DATABASE_URL: *db-url
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data:
